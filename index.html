<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel M | Artist</title>
  <meta name="description" content="Daniel M — official artist website.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 64px 28px;
      border: 1px solid #292933;
      border-radius: 24px;
      background: #121219;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { font-size: clamp(42px, 9vw, 76px); margin: 0 0 12px; }
    .tagline { color: #b9b9c4; font-size: 18px; margin-bottom: 42px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 999px;
      border: 1px solid #3a3a48;
      color: white;
      text-decoration: none;
    }
    a:hover { background: #22222d; }
    .contact { margin-top: 42px; color: #aaaab5; font-size: 15px; }
    .contact a { border: 0; padding: 0; color: #fff; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Daniel M</h1>
    <p class="tagline">Official artist website</p>

    <div class="links">
      <!-- Replace the # links below with your real links -->
      <a href="#" target="_blank" rel="noopener">Spotify</a>
      <a href="#" target="_blank" rel="noopener">Instagram</a>
      <a href="#" target="_blank" rel="noopener">YouTube</a>
    </div>

    <!-- IMPORTANT: Replace this email with your real artist email. -->
    <p class="contact">
      Contact: <a href="mailto:YOUR-EMAIL@example.com">YOUR-EMAIL@example.com</a>
    </p>
  </main>
</body>
</html>
